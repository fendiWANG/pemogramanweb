<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Text</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background: white;
        }

        .container{
            width: 360px;
            margin: 50px auto;
            background: #efefef;
            border: 1px solid #cfcfcf;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.35);
            padding: 14px;
        }

        #txtCari{
            width: 250px;
            height: 28px;
            font-size: 18px;
            margin-bottom: 12px;
            border: 1px solid #999;
        }

        .nama{
            font-size: 18px;
            line-height: 38px;
            color: black;
        }

        .merah{
            color: red;
        }
    </style>
</head>

<body>

    <div class="container">

        <input type="text" id="txtCari">

        <div class="nama">Sun Microsystem</div>
        <div class="nama">Apache Software Foundation</div>
        <div class="nama">Oracle Coorporation</div>
        <div class="nama">International Bussiness Machines</div>
        <div class="nama">Microsoft Coorporation</div>
        <div class="nama">Apple Inc</div>
        <div class="nama">Sap Ag</div>
        <div class="nama">Accenture</div>
        <div class="nama">Computer Sciences Coorporation</div>
        <div class="nama">Google</div>
        <div class="nama">Softbank</div>
        <div class="nama">Yahoo</div>

    </div>

    <script>
        $(document).ready(function(){

            $("#txtCari").keyup(function(){

                var cari = $(this).val().toLowerCase();

                $(".nama").removeClass("merah");

                $(".nama").each(function(){

                    var teks = $(this).text().toLowerCase();

                    if(teks.indexOf(cari) != -1 && cari != ""){
                        $(this).addClass("merah");
                    }

                });

            });

        });
    </script>

</body>
</html>
